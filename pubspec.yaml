name: artverse
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_colorpicker: ^1.0.3
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  material_design_icons_flutter: ^7.0.7296
  shared_preferences: ^2.5.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_sign_in: ^6.3.0
  external_path: ^2.2.0
  permission_handler: ^11.0.1
  ffmpeg_kit_flutter_new: ^1.6.1
  video_player: ^2.8.1
  file_picker: ^10.1.9
  better_player_plus: ^1.0.8
  intl: ^0.20.0
  uuid: ^4.0.0
  blur: ^3.0.0
  connectivity_plus: ^6.0.3
  flex_color_picker: ^3.3.0
  flutter_switch: ^0.3.2
  http: ^1.3.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  supabase_flutter: ^2.12.0
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^9.2.4
  flutter_staggered_grid_view: ^0.7.0
  lottie: ^3.3.2
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  vector_math: ^2.1.4

  model_viewer_plus: ^1.10.0
  google_fonts: ^8.0.2
  flutter_animate: ^4.5.2
  photo_view: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/branding/app_icon.png"

flutter_native_splash:
  background_image: "assets/images/branding/background_studio.png"
  android: true
  ios: true
  fullscreen: true

flutter:
  assets:
    - .env
    - assets/
    - assets/images/banners/
    - assets/images/branding/
    - assets/images/profile/
    - assets/images/community/
    - assets/video/
  uses-material-design: true
